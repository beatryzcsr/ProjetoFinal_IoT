<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <script defer src="../index.js" type="text/javascript"></script>
    <link rel="stylesheet" href="./dash.css">


</head>
<body>
      <h1>Monitoramento IoT em <span class="card-purple">Tempo Real</span></h1>
  <div id="status" class="status disconnected">Status: Desconectado</div>

  <div class="cards-container">
    <div class="card">
      <h3>Temperatura</h3>
      <div class="img">
        <img src="../assets/telm.png" alt="">
      </div>
      <div class="value"><span id="temp">--</span> <span class="unit">°C</span></div>
    </div>

    <div class="card">
      <h3>Umidade</h3>
      <div class="img">
        <img src="../assets/clima.png" alt="">
      </div>
      <div class="value"><span id="hum">--</span> <span class="unit">%</span></div>
    </div>

    <div class="card">
      <h3>Qualidade do Ar</h3>
      <div class="img">
        <img src="../assets/air.png" alt="">
      </div>
      <div class="value"><span id="air">--</span></div>
    </div>
  </div>

    <h3>Projeto IOT SESI SENAI Vinhedo <span class="card-purple">Grupo 03</span></h3>
</body>
</html>
